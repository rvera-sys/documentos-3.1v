<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor — Documentos 3.2</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{ --navy:#0e2a5c; --rojo:#CC0000; --gris:#6b7280; --linea:#e5e7eb; }
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1f2937;background:#f3f4f6}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:50}
.topbar a{color:#374151;text-decoration:none;font-size:13px}
#doc-title{border:none;font-size:16px;font-weight:600;flex:1;padding:6px 8px;background:transparent}
#doc-title:focus{outline:none;background:#f9fafb;border-radius:6px}
.estado{font-size:11px;padding:4px 8px;border-radius:20px;white-space:nowrap}
.estado.ok{background:#ecfdf5;color:#065f46}
.estado.sucio{background:#fef3c7;color:#92400e}
.btn{padding:7px 12px;border:1px solid var(--linea);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn:hover{background:#f9fafb}
.btn.primary{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.btn.primary:hover{background:#a80000}

.layout{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 55px)}
.panel{background:#fff;border-right:1px solid var(--linea);overflow-y:auto;padding:14px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--linea)}
.tabs button{flex:1;padding:9px;border:none;background:none;cursor:pointer;font-weight:700;font-size:12px;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--rojo);border-bottom-color:var(--rojo)}
.tabpane{display:none}.tabpane.active{display:block}
.muted{color:#9ca3af;font-size:12px}

select,input[type=text],input[type=date],textarea{width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit}
.sec{margin-bottom:14px}
.sec-title{font-size:11px;font-weight:800;color:var(--rojo);letter-spacing:.04em;border-bottom:1px solid var(--linea);padding-bottom:4px;margin-bottom:8px}
.campo{display:inline-block;width:calc(50% - 5px);margin-right:6px;margin-bottom:8px;vertical-align:top}
.campo.full{display:block;width:100%;margin-right:0}
.campo label{display:block;font-size:10.5px;font-weight:600;color:#4b5563;margin-bottom:3px}

.cl-toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
#cl-contador{font-size:11px;color:var(--gris);margin-left:auto}
.cl-item{border:1px solid var(--linea);border-radius:8px;margin-bottom:6px;background:#fff;transition:.15s}
.cl-item.over{border-color:var(--rojo);box-shadow:0 0 0 2px rgba(204,0,0,.12)}
.cl-item.dragging{opacity:.4}
.cl-item.off{background:#fafafa;opacity:.55}
.cl-row{display:flex;align-items:center;gap:7px;padding:8px 10px}
.grip{cursor:grab;color:#c4c4c4;font-size:13px}
.cl-num{font-size:9.5px;font-weight:800;color:var(--navy);background:#eef2ff;padding:2px 5px;border-radius:4px;white-space:nowrap;min-width:52px;text-align:center}
.cl-nombre{font-size:12px;font-weight:600;flex:1;cursor:pointer}
.cl-nombre:hover{color:var(--rojo)}
.tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;text-transform:uppercase}
.tag-custom{background:#fce7f3;color:#9d174d}
.tag-opt{background:#e0f2fe;color:#075985}
.tag-edit{background:#fef3c7;color:#92400e}
.tag-fam{background:#dcfce7;color:#166534}
.tag-ya{background:#f3f4f6;color:#6b7280}
.cl-tools{display:flex;gap:3px;padding:0 10px 8px 34px}
.cl-tools button{border:1px solid var(--linea);background:#fff;border-radius:4px;cursor:pointer;font-size:10px;padding:2px 6px}
.cl-tools button:hover{background:#f3f4f6}
.cl-tools .del:hover{background:#fee2e2;border-color:#fca5a5}
.cl-edit{padding:8px 10px 10px;border-top:1px dashed var(--linea);background:#fafafa}
.cl-edit input,.cl-edit textarea{margin-bottom:6px;font-size:11.5px}
.cl-edit textarea{font-family:ui-monospace,Menlo,monospace;line-height:1.5}
.cl-edit-tools{display:flex;gap:5px}
.mini{padding:4px 9px;border:1px solid var(--linea);background:#fff;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600}
.mini.primary{background:var(--navy);color:#fff;border-color:var(--navy)}

.chk{font-size:11px;padding:8px 10px;border-radius:6px;margin-bottom:10px}
.chk.ok{background:#ecfdf5;color:#065f46}
.chk.warn{background:#fffbeb;color:#92400e}
.chk-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chk-tags span{background:#fff;border:1px solid #fcd34d;padding:1px 5px;border-radius:4px;font-family:ui-monospace,monospace;font-size:10px}

.preview-wrap{overflow-y:auto;padding:22px;background:#e9ebee}
.doc-hoja{max-width:210mm;margin:0 auto;background:#fff;padding:24mm 20mm;box-shadow:0 2px 14px rgba(0,0,0,.10);font-family:'Times New Roman',Times,serif;font-size:12.5px;line-height:1.75;color:#111}
.doc-head h1{font-size:16px;text-align:center;color:var(--navy);margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase;font-family:Inter,sans-serif}
.doc-lugar{text-align:right;font-size:12px;color:#374151;margin-bottom:8px}
.doc-head hr{border:none;border-top:2px solid var(--rojo);margin:6px 0 18px}
.cl-bloque{margin-bottom:13px;page-break-inside:avoid}
.cl-titulo{font-size:12px;font-weight:700;margin:0 0 3px;color:var(--navy);font-family:Inter,sans-serif}
.cl-texto{margin:0;text-align:justify;white-space:pre-wrap}
.ph-falta{background:#fef08a;color:#854d0e;padding:0 3px;border-radius:3px;font-weight:700}
.doc-firmas{display:flex;gap:60px;margin-top:46px}
.doc-firmas .firma{flex:1;text-align:center}
.doc-firmas .firma span{display:block;border-top:1px solid #333;margin-bottom:4px;height:1px}
.doc-firmas .firma small{font-size:10px;color:#555}
.doc-pie{margin-top:26px;padding-top:8px;border-top:1px solid #ddd;font-size:9.5px;color:#6b7280;text-align:center}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:12px;width:min(760px,100%);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linea)}
.modal-head h3{margin:0;font-size:15px;flex:1}
.modal-body{overflow-y:auto;padding:12px 16px}
.cat-item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--linea);border-radius:8px;padding:10px;margin-bottom:7px}
.cat-item strong{font-size:12.5px}
.cat-prev{font-size:11px;color:var(--gris);margin:4px 0;line-height:1.5}
.cat-item code{font-size:10px;color:#9ca3af}

.pdf-render{position:fixed;left:-10000px;top:0;width:210mm;background:#fff}
.pdf-render .doc-hoja{box-shadow:none;padding:0}

@media print{
  .topbar,.panel,.modal{display:none!important}
  .layout{display:block;height:auto}
  .preview-wrap{padding:0;background:#fff;overflow:visible}
  .doc-hoja{box-shadow:none;padding:0;max-width:none}
  .ph-falta{background:none;color:inherit;font-weight:inherit}
}
@media(max-width:980px){ .layout{grid-template-columns:1fr;height:auto} .panel{border-right:none;border-bottom:1px solid var(--linea)} }
</style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html">← Volver</a>
  <input type="text" id="doc-title" placeholder="Título del documento" oninput="renderPreview();marcarSucio()">
  <span id="estado-guardado" class="estado ok">—</span>
  <button class="btn" onclick="copiarTexto()" title="Copiar como texto plano">📋 Texto</button>
  <button class="btn" onclick="imprimir()">🖨️ Imprimir</button>
  <button class="btn" onclick="generatePDF()">📥 PDF</button>
  <button class="btn primary" onclick="saveDraft()">💾 Guardar</button>
  <button class="btn" onclick="logout()">Salir</button>
</div>

<div class="layout">
  <aside class="panel">
    <label class="muted" style="font-weight:700">TEMPLATE</label>
    <select id="template-select" onchange="loadTemplate()" style="margin:6px 0 14px"></select>

    <div class="tabs">
      <button id="tb-datos" class="active" onclick="tab('datos')">📝 Datos</button>
      <button id="tb-clausulas" onclick="tab('clausulas')">📜 Cláusulas</button>
    </div>

    <div id="pane-datos" class="tabpane active">
      <div id="checklist"></div>
      <div id="form-fields"><p class="muted">Seleccioná un template</p></div>
    </div>

    <div id="pane-clausulas" class="tabpane">
      <div class="cl-toolbar">
        <button class="btn primary" onclick="abrirCatalogo()">+ Del catálogo</button>
        <button class="btn" onclick="nuevaClausulaLibre()">✎ Cláusula propia</button>
        <span id="cl-contador"></span>
      </div>
      <p class="muted" style="margin:0 0 8px">Destildá para excluir sin borrar · arrastrá ⠿ para reordenar · clic en el nombre para editar el texto. La numeración (PRIMERA, SEGUNDA…) se recalcula sola.</p>
      <div id="clausulas-list"><p class="muted">Seleccioná un template</p></div>
    </div>
  </aside>

  <main class="preview-wrap">
    <div id="preview-content"><p class="muted">Seleccioná un template para ver el preview</p></div>
  </main>
</div>

<div class="modal" id="modal-catalogo">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Catálogo de cláusulas</h3>
      <input type="text" id="cat-buscar" placeholder="Buscar por título o texto…" oninput="renderCatalogo()" style="max-width:280px">
      <button class="mini" onclick="cerrarCatalogo()">✕</button>
    </div>
    <div class="modal-body"><div id="cat-list"></div></div>
  </div>
</div>

<script>
function tab(n){
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('pane-'+n).classList.add('active');
  document.getElementById('tb-'+n).classList.add('active');
}
</script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/templates-completos.js"></script>
<script src="js/clausulas-engine.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
